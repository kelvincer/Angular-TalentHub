<aside class="w-fit bg-base-100 border-r border-base-300 h-full">
    <div class="menu-title text-2xl">
        <div class="flex flex-row items-center justify-center">
            Talent Hub
            <div class="badge badge-soft badge-info ml-2">{{computedRole()}}</div>

        </div>

        <div class="badge badge-lg badge-secondary">Hello {{userName()}}</div>

    </div>

    <ul class="menu w-full">
        @for (item of menu(); track item) {
        <li>
            <a [routerLink]="item.link" routerLinkActive="menu-active">{{item.name}}</a>
        </li>
        }

        <li class="mt-4 border-t border-base-300 pt-3">
            <button class="text-error" (click)="logout()">
                Cerrar sesión
            </button>
        </li>

    </ul>

</aside>
