<aside class="w-72 bg-base-100 border-r border-base-300 h-full">
    <div class="menu-title text-2xl">
        Talent Hub
        <div class="badge badge-lg ml-2 badge-secondary">Hello {{userName()}}</div>
    </div>

    <ul class="menu w-72">
        @for (item of menu(); track item) {
        <li>
            <a [routerLink]="item.link" routerLinkActive="menu-active">{{item.name}}</a>
        </li>
        }
    </ul>
</aside>
