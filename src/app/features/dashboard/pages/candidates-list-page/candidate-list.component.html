<div class="mb-6 flex flex-wrap items-center justify-between gap-4">
    <div>
        <h1 class="text-2xl font-bold">Candidatos</h1>
        <p class="text-base-content/60">Gestiona el banco de talento de la empresa.</p>
    </div>
    <a class="btn btn-primary text-white" (click)="navigateNewCandidate()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
            class="h-5 w-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        Nuevo candidato
    </a>
</div>

<label class="input input-bordered mt-4 flex items-center gap-2 sm:w-72">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
        class="h-4 w-4 opacity-50">
        <path stroke-linecap="round" stroke-linejoin="round"
            d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
    </svg>
    <input type="text" class="grow" placeholder="Buscar por nombre, correo, puesto o habilidad..."
        [(ngModel)]="search" />
</label>

<div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3 mt-4">
    @for (item of filteredCandidates(); track item.id) {
    <app-candidate-card [candidate]="item"></app-candidate-card>
    }
</div>
