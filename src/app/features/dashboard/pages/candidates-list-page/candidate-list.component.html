<div class="mb-6 flex flex-wrap items-center justify-between gap-4">
    <div>
        <h1 class="text-2xl font-bold">Candidatos</h1>
        <div class="text-base-content/60">Gestiona el banco de talento de la empresa.</div>
    </div>
    <a class="btn btn-primary text-white" (click)="navigateNewCandidate()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
            class="h-5 w-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        Nuevo candidato
    </a>
</div>

<div class="flex flex-wrap mt-4">
    <label class="input">
        <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none" stroke="currentColor">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
            </g>
        </svg>
        <input type="search" class="grow" placeholder="Buscar por título, ubicación o área..." [(ngModel)]="search" />
    </label>
</div>

<div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3 mt-3">
    @for (item of filteredCandidates(); track item.id) {
    <app-candidate-card [candidate]="item"></app-candidate-card>
    }
</div>
