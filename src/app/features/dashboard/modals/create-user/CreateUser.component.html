@if (modalOpen()) {
<dialog class="modal modal-open">

    <div class="modal-box overflow-visible">

        <h3 class="font-bold text-lg">
            Nuevo Usuario
        </h3>

        <form class="py-4" [formGroup]="createUserForm" (ngSubmit)="handleSubmit()">

            <input class="input input-bordered w-full" placeholder="Nombre" formControlName="name">

            <input class="input input-bordered w-full mt-3" placeholder="Correo" formControlName="email">

            <input class="input input-bordered w-full mt-3" type="password" placeholder="Contraseña"
                formControlName="password">

            <select class="select select-bordered w-full mt-3" formControlName="role">
                <option value="" disabled>Selecciona el rol</option>
                @for (entry of roles | keyvalue; track entry.key) {
                <option [value]="entry.key">{{ entry.value }}</option>
                }
            </select>

            <select class="select select-bordered w-full mt-3" formControlName="state">
                <option value="" disabled>Selecciona el estado</option>
                @for (entry of statuses | keyvalue; track entry.key) {
                <option [value]="entry.key">{{ entry.value }}</option>
                }
            </select>

            <div class="modal-action">

                <button class="btn" type="button" (click)="closeModal()">
                    Cancelar
                </button>

                <button class="btn btn-primary" type="submit">
                    Guardar
                </button>

            </div>

        </form>

    </div>

</dialog>

}
